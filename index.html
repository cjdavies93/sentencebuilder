<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Builder</title>
<style>
  :root {
    --bg: #c9d9f7;
    --panel: #ffffff;
    --ink: #1c2540;
    --muted: #5d6783;
    --accent: #2c55e0;
    --accent-dark: #1b3bb0;
    --line: #c3cbdb;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 28px 28px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
  }
  .score {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: var(--muted);
  }
  .score input { width: 64px; text-align: center; font-weight: 700; color: var(--ink); }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.01em; }
  p.intro { margin: 0 0 24px;  color: var(--muted); line-height: 1.5; }
  .row {
    display: grid;
    grid-template-columns: 140px 1fr 40px;
    gap: 12px;
    margin-bottom: 12px;
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--btn, var(--accent));
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { filter: brightness(0.94); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  button.clear {
    padding: 0;
    font-size: 1rem;
    line-height: 1;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }
  button.clear:hover { background: transparent; color: var(--ink); border-color: var(--muted); }
  input {
    font: inherit;
    font-size: 1.1rem;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
  }
  input.error { color: var(--error); font-size: 0.85rem; }
  @media (max-width: 420px) {
    .row { grid-template-columns: 100px 1fr 36px; gap: 8px; }
    main { padding: 24px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Sentence Builder</h1>
    <label class="score">Score
      <input type="text" id="score" value="0" readonly>
    </label>
  </header>
  <p class="intro">Select a button to pull a random word from its list.</p>
  <div id="rows"></div>
</main>

<script>
  const LISTS = ["subject", "verb", "object", "adjective", "adverb", "pronoun"];
  const COLOURS = {
    subject:   "#f9c6d9",  // pastel pink
    verb:      "#fdd3b0",  // pastel peach
    object:    "#fcefa0",  // pastel yellow
    adjective: "#bfead0",  // pastel mint
    adverb:    "#b6e6ea",  // pastel aqua
    pronoun:   "#dcc9f3"   // pastel lavender
  };
  const cache = {};   // list name -> array of words, loaded on first click
  const last = {};    // list name -> last word shown, to avoid immediate repeats

  async function getList(name) {
    if (!cache[name]) {
      const res = await fetch(name + ".json");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) throw new Error("empty list");
      cache[name] = data;
    }
    return cache[name];
  }

  function pick(name, words) {
    if (words.length === 1) return words[0];
    let word;
    do { word = words[Math.floor(Math.random() * words.length)]; }
    while (word === last[name]);
    last[name] = word;
    return word;
  }

  const scoreField = document.getElementById("score");
  let score = 0;
  function changeScore(delta) {
    score += delta;
    scoreField.value = score;
  }

  const container = document.getElementById("rows");
  LISTS.forEach(name => {
    const row = document.createElement("div");
    row.className = "row";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = name;
    btn.id = "btn-" + name;
    btn.style.setProperty("--btn", COLOURS[name]);

    const field = document.createElement("input");
    field.type = "text";
    field.readOnly = true;
    field.id = "field-" + name;
    field.setAttribute("aria-labelledby", btn.id);
    field.setAttribute("aria-live", "polite");

    let counted = false; // true while this field holds a word that has been scored

    btn.addEventListener("click", async () => {
      field.classList.remove("error");
      try {
        const words = await getList(name);
        field.value = pick(name, words);
        if (!counted) {
          counted = true;
          changeScore(1);
        }
      } catch (err) {
        field.classList.add("error");
        field.value = "Could not load " + name + ".json – serve this page from a web server";
      }
    });

    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "clear";
    clear.textContent = "x";
    clear.setAttribute("aria-label", "Clear " + name);
    clear.title = "Clear";
    clear.addEventListener("click", () => {
      if (counted) {
        counted = false;
        changeScore(-1);
      }
      field.value = "";
      field.classList.remove("error");
    });

    row.append(btn, field, clear);
    container.appendChild(row);
  });
</script>
</body>
</html>
