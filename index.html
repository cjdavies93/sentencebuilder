<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Picker</title>
<style>
  :root {
    --bg: #e6ebf2;
    --panel: #ffffff;
    --ink: #1c2540;
    --muted: #5d6783;
    --accent: #2c55e0;
    --accent-dark: #1b3bb0;
    --line: #c3cbdb;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12172a;
      --panel: #1c2340;
      --ink: #eef1fa;
      --muted: #9aa5c4;
      --accent: #6d8cff;
      --accent-dark: #93a9ff;
      --line: #36406a;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 28px 28px;
  }
  h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -0.01em; }
  p.intro { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
  .row {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  input {
    font: inherit;
    font-size: 1.1rem;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
  }
  input.error { color: var(--error); font-size: 0.85rem; }
  @media (max-width: 420px) {
    .row { grid-template-columns: 110px 1fr; }
    main { padding: 24px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Word Picker</h1>
  <p class="intro">Select a button to pull a random word from its list.</p>
  <div id="rows"></div>
</main>

<script>
  const LISTS = ["subject", "verb", "object", "adjective", "adverb", "pronoun"];
  const cache = {};   // list name -> array of words, loaded on first click
  const last = {};    // list name -> last word shown, to avoid immediate repeats

  async function getList(name) {
    if (!cache[name]) {
      const res = await fetch(name + ".json");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) throw new Error("empty list");
      cache[name] = data;
    }
    return cache[name];
  }

  function pick(name, words) {
    if (words.length === 1) return words[0];
    let word;
    do { word = words[Math.floor(Math.random() * words.length)]; }
    while (word === last[name]);
    last[name] = word;
    return word;
  }

  const container = document.getElementById("rows");
  LISTS.forEach(name => {
    const row = document.createElement("div");
    row.className = "row";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = name;
    btn.id = "btn-" + name;

    const field = document.createElement("input");
    field.type = "text";
    field.readOnly = true;
    field.id = "field-" + name;
    field.setAttribute("aria-labelledby", btn.id);
    field.setAttribute("aria-live", "polite");

    btn.addEventListener("click", async () => {
      field.classList.remove("error");
      try {
        const words = await getList(name);
        field.value = pick(name, words);
      } catch (err) {
        field.classList.add("error");
        field.value = "Could not load " + name + ".json – serve this page from a web server";
      }
    });

    row.append(btn, field);
    container.appendChild(row);
  });
</script>
</body>
</html>
